name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); provenance is automatic

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # No token: npm trusts this workflow via OIDC (configured on npmjs.com).
      # Requires npm >= 11.5.1 (Node 24.21 ships 11.19) and a GitHub-hosted runner.
      # Staged: the version only goes live after a maintainer approves it with 2FA
      # (npmjs.com, or `npm stage approve`). The trusted publisher does not allow `npm publish`.
      - run: npm stage publish --access public
